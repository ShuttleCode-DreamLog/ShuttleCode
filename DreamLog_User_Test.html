<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamLog</title><style>
:root{--ink:#303c39;--muted:#7b8882;--green:#527666;--paper:#faf9f5;--line:#e0e5dc;--soft:#eef2e9}*{box-sizing:border-box}body{margin:0;background:#e9ece5;color:var(--ink);font:15px/1.6 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9bbf9e;outline-offset:3px}button{border:0;background:none}#phone{max-width:470px;margin:24px auto;background:var(--paper);height:calc(100dvh - 48px);min-height:540px;border-radius:32px;overflow:hidden;box-shadow:0 20px 70px #30423517;display:flex;flex-direction:column;position:relative}header{padding:21px 25px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}header h1{font:29px Georgia,serif;flex:1;margin:0}header small{font-size:10px;letter-spacing:2px;color:var(--muted)}main{padding:24px;overflow-y:auto;flex:1}h2{font:26px Georgia,serif;margin:4px 0 15px}h3{font:20px Georgia,serif;margin:26px 0 10px}p{margin:9px 0 16px}.muted,.date{color:var(--muted);font-size:12px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--green);text-transform:uppercase}.row{display:flex;align-items:center;gap:10px}.spread{justify-content:space-between}.card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:20px;padding:18px;margin:13px 0;background:#fffefa}.card:hover{border-color:#9aaf9c}.title{font:21px Georgia,serif;margin:0 0 8px}.tag{display:inline-block;font-size:11px;background:var(--soft);padding:3px 9px;border-radius:20px;margin:3px 4px 3px 0}.motif{font:64px Georgia,serif;color:#93a684;padding-left:12px}.primary{background:var(--green);color:white;border-radius:13px;padding:12px 19px}.secondary{border:1px solid var(--line);background:#fffefa;border-radius:12px;padding:10px 15px}.danger{color:#a45650}.wide{width:100%}input,textarea,select{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fffefa;color:var(--ink);width:100%}textarea{resize:vertical;min-height:150px}label{display:block;margin:15px 0 5px;font-size:12px;color:var(--muted)}nav{display:flex;border-top:1px solid var(--line);padding:10px 9px 15px;background:var(--paper);justify-content:space-around}nav button{font-size:10px;color:var(--muted);min-width:54px}nav b{display:block;font-size:24px;line-height:32px;font-weight:400}nav .active{color:var(--green)}nav .add b{background:var(--green);color:white;border-radius:12px;width:42px;margin:auto}.back{font-size:23px;padding:0 4px}#toast{position:absolute;bottom:92px;background:#303c39;color:white;border-radius:12px;left:22px;right:22px;padding:12px;z-index:4;font-size:13px}#toast:empty{display:none}.themes{height:250px;position:relative;margin:15px auto;width:300px}.bubble{position:absolute;border:1px solid #b9c7aa;border-radius:50%;display:grid;place-items:center;background:#e9efdf99;font:18px Georgia,serif}.chat{padding:12px 16px;border-radius:18px;background:var(--soft);margin:13px 25px 13px 0;white-space:pre-wrap}.chat.user{margin:13px 0 13px 40px;background:#e4e8e2}.composer{display:flex;gap:7px;margin-top:20px}.composer input{min-width:0}svg.land{width:100%;height:180px;border-radius:15px;background:#e7eee6}.switch{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}.switch input{width:22px;height:22px}.record{border:1px solid #a9bdab;border-radius:50%;height:84px;width:84px;font-size:30px;background:var(--soft);touch-action:none;user-select:none}.record.on{background:#d9b6aa}.hint{font-size:11px;color:var(--muted)}dialog{border:0;border-radius:22px;max-width:370px;width:90%;color:var(--ink);padding:24px}dialog::backdrop{background:#22332b66}.actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}blockquote{border-left:2px solid #aabb9e;margin:15px 0;padding-left:15px;color:#657360}@media(max-width:500px){body{background:var(--paper)}#phone{height:100dvh;min-height:0;margin:0;border-radius:0;max-width:none;box-shadow:none}}@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
header h1{min-width:0;overflow-wrap:anywhere}.title-edit{font:inherit;text-align:left;padding:0}.title-edit span{font:14px system-ui;color:var(--muted)}.record.on{background:#c64c49;border-color:#c64c49;color:white}.record-dock{position:relative;width:100%;max-width:340px;height:210px;margin:10px auto 18px;text-align:center}.record-dock>.record{position:absolute;top:75px;left:50%;transform:translateX(-50%)}.record-controls{position:absolute;inset:0;pointer-events:none}.record-action{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:70px;min-height:60px;padding:6px;border:0;background:transparent;pointer-events:auto;color:var(--green)}.record-action svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.record-action span{font-size:10px;line-height:1.4}.record-action.confirm{top:0;left:50%;transform:translateX(-50%)}.record-action.cancel{top:82px;left:10px}.record-action.keyboard{top:82px;right:10px}.record-dock #recordstatus{position:absolute;top:174px;left:0;right:0}.record-controls[hidden]{display:none}.conversation-entry{display:flex;align-items:center;gap:8px;font-size:13px}nav b svg{vertical-align:middle}.capture-save{position:sticky;bottom:-24px;padding:14px 0 20px;background:var(--paper);z-index:2}.trash{display:grid;place-items:center;color:#bd4e49;background:transparent;border:0;padding:10px;flex-shrink:0}.autosave-status{text-align:center}</style><body><div id="phone"><header></header><main id="main"></main><nav></nav><div id="toast" role="status"></div></div><dialog id="modal"></dialog>
<script>
const seed={dreams:[{id:1,title:'A garden beyond the clouds',date:'2026-10-15',text:'I walked into a floating garden above the clouds. A friend I had not seen in years was waiting there. We planted flowers together, and I felt calm and happy.',tags:['Happy','Nature','Connection'],motif:'❀',summary:'A peaceful reunion in a floating garden.',analysis:'The garden may bring together feelings of connection and growth. Does reconnecting with someone feel relevant to your life right now?',notes:'',versions:[],messages:[]},{id:2,title:'Running under a silver moon',date:'2026-08-20',text:'I was running through a forest under a bright moon. A dragon followed me, but when I stopped it turned into a small bird. I felt relieved.',tags:['Fear','Nature','Change'],motif:'☾',summary:'A chase becomes a moment of relief.',analysis:'This dream moves from uncertainty toward relief. You might reflect on something that felt less intimidating after you faced it.',notes:'',versions:[],messages:[]}],notes:[{id:2,title:'Presentation this week',date:'2026-10-12',text:'I have a presentation this week. I feel excited, but a little nervous.'},{id:1,title:'An old friend',date:'2026-10-07',text:'I caught up with an old friend today. It was lovely to reconnect.'}],pattern:'Returning to nature',settings:{dreams:true,notes:true}};
let db;try{db=JSON.parse(localStorage.getItem('dreamlog-test-v1'))||structuredClone(seed)}catch{db=structuredClone(seed)}

let draftTitle='',titleEdited=false,recordSnapshot=null,captureId=null;
let route='home',selected=1,noteId=2,origin='journal',query='',filter='All',draft='',visualMode='Generate',generated=false,processing=null,recording=false,recordTimer,toastTimer;
try{const restored=JSON.parse(localStorage.getItem('dreamlog-draft-v1'));if(restored){draft=restored.text||'';draftTitle=restored.title||'';titleEdited=!!restored.edited;captureId=restored.id||null}}catch{}
function persistDraft(){try{localStorage.setItem('dreamlog-draft-v1',JSON.stringify({text:draft,title:draftTitle,edited:titleEdited,id:captureId}))}catch{}}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem('dreamlog-test-v1',JSON.stringify(db))}catch{toast('Changes are kept for this session only.')}};
const d=()=>db.dreams.find(x=>x.id===selected);const date=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
function toast(s){$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',3000)}
function go(r){if(route==='capture'&&r!=='capture'){autoSaveCapture();draft='';draftTitle='';titleEdited=false;captureId=null;persistDraft()}if(recording){clearTimeout(recordTimer);recording=false;recordSnapshot=null}route=r;query='';filter='All';render();$('#main').scrollTop=0;location.hash=r}
function openDream(id,from='journal'){selected=id;origin=from;generated=false;go('detail')}
function btn(t,a,cl='secondary'){return `<button type="button" class="${cl}" onclick="${a}">${t}</button>`}
function tags(xs){return xs.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
function cards(xs){return xs.map(x=>`<button class="card" onclick="openDream(${x.id},'${route}')"><div class="row spread"><div><div class="date">${date(x.date)}</div><div class="title">${esc(x.title)}</div>${tags(x.tags)}<div class="muted">${esc(x.summary)}</div></div><span class="motif" aria-hidden="true">${x.motif}</span></div></button>`).join('')}
function land(style='Watercolor'){return `<svg class="land" viewBox="0 0 360 180" role="img" aria-label="Illustrated dream landscape, ${esc(style)}"><rect width="360" height="180" fill="${style==='Moonlight'?'#344c5d':'#e4ede6'}"/><circle cx="275" cy="43" r="22" fill="#eadba7"/><path d="M0 145L92 44 164 138 227 72 360 159V180H0" fill="#a5bba6"/><path d="M0 166Q100 100 180 156T360 144V180H0" fill="#6f927e"/><path d="M115 180Q150 145 235 163T360 172" fill="none" stroke="#d2dfcf" stroke-width="14"/><g fill="#dbe4c5"><circle cx="40" cy="142" r="5"/><circle cx="68" cy="156" r="4"/><circle cx="310" cy="132" r="5"/></g></svg>`}
function render(){let title={home:'DreamLog',journal:'Journal',capture:draftTitle||'Journal',detail:d()?.title||'Dream',conversation:d()?.title||'Conversation',patterns:'Patterns',pattern:db.pattern,notes:'Life notes',note:noteLabel(db.notes.find(n=>n.id===noteId)),editor:noteId?'Edit note':'New note',settings:'Settings'}[route];let back={capture:'journal',detail:origin,conversation:'detail',pattern:'patterns',note:'notes',editor:noteId?'note':'notes'}[route];$('header').innerHTML=(back?btn('‹',`go('${back}')`,'back'):'')+`<h1>${(route==='capture'||route==='detail')?`<button type="button" class="title-edit" onclick="${route==='capture'?'editDraftTitle()':'editSavedTitle()'}" aria-label="Edit dream title">${esc(title)} <span aria-hidden="true">✎</span></button>`:esc(title)}</h1>`+(route==='capture'?`<button type="button" class="trash" aria-label="Delete current dream" onclick="discardCapture()">${trashIcon()}</button>`:!back?btn('⌂',"go('home')",'back'):'');$('nav').innerHTML=[['journal','▤','Journal'],['patterns',bulb(),'Pattern'],['capture','+','Add dream'],['notes','✎','Life notes'],['settings','⚙','Settings']].map(([r,i,t])=>`<button class="${r===route?'active ':''}${r==='capture'?'add':''}" onclick="go('${r}')"><b>${i}</b>${t}</button>`).join('');let html='';
if(route==='home')html=`<div class="eyebrow">A little space for your inner world</div><h2>Your dreams, connected.</h2><p class="muted">Notice what stays with you.</p>${db.dreams.length?`<button class="card" onclick="openDream(${db.dreams[0].id},'home')"><div class="eyebrow">Today’s dream</div><div class="row spread"><div><div class="title">${esc(db.dreams[0].title)}</div><p class="muted">${esc(db.dreams[0].summary)}</p></div><span class="motif">☾</span></div></button>`:'<p>Your next dream starts here.</p>'}<div class="themes" aria-label="Dream themes"><button class="bubble" style="width:125px;height:125px;top:70px;left:87px;background:#eee6c3" onclick="themed('Happy')">Happy</button><button class="bubble" style="width:95px;height:95px;top:5px;left:110px" onclick="themed('Nature')">Nature</button><button class="bubble" style="width:85px;height:85px;top:48px;left:28px;background:#dce9ef99" onclick="themed('Connection')">Connection</button><button class="bubble" style="width:80px;height:80px;top:150px;left:40px" onclick="themed('Change')">Change</button></div>${btn('Record a dream',"go('capture')",'primary wide')}`;
if(route==='journal')html=`<div class="row"><input aria-label="Search dreams" placeholder="Search dreams…" value="${esc(query)}" oninput="query=this.value;updateList()"><button class="secondary" onclick="filterDialog()">Filter</button></div><div id="list"></div>`;
if(route==='capture')html=`<div class="eyebrow">Capture before it fades</div><h2>What do you remember?</h2><label for="dreamtext">Your dream</label><textarea id="dreamtext" style="min-height:240px" placeholder="A place, a feeling, a tiny detail…" oninput="updateDraft(this.value)">${esc(draft)}</textarea><p class="hint">Voice transcription is simulated. Tap the title to rename your dream.</p><div class="record-dock"><div id="recordcontrols" class="record-controls" ${recording?'':'hidden'}><button type="button" class="record-action cancel" onclick="cancelRecord()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg><span>Cancel</span></button><button type="button" class="record-action confirm" aria-label="Confirm recording" onclick="stopRecord()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 5 5L20 6"/></svg><span>Confirm</span></button><button type="button" class="record-action keyboard" onclick="keyboardCapture()"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h1m4 0h1m4 0h1M6 12h1m4 0h1m4 0h1M7 16h10"/></svg><span>Keyboard</span></button></div><button type="button" id="record" class="record ${recording?'on':''}" aria-label="${recording?'Stop recording':'Start recording'}" aria-pressed="${recording}" onclick="toggleRecord()">${mic()}</button><div class="muted" id="recordstatus" role="status">${recording?'Recording…':'Hold to speak · tap to start'}</div></div><p class="hint autosave-status" role="status">${draft.trim()?'Saved automatically':'Your dream saves automatically as you write.'}</p>`;
if(route==='detail'&&d()){let x=d();html=`<div class="row spread"><div class="date">${date(x.date)}</div>${btn('Delete',"deleteDream()",'danger')}</div><div>${tags(x.tags)}${btn('+ Tag','editTags()','tag')}</div><h3>Original text</h3><p>${esc(x.text)}</p>${btn('Edit text','editText()')}<h3>Summary</h3><p>${esc(x.summary)}</p><h3>Analysis</h3><p>${esc(x.analysis)}</p><div class="row">${btn('Annotate','annotate()')}${btn(chatIcon()+'<span>Conversation analysis</span>',"go('conversation')",'primary conversation-entry')}</div><h3>Notes</h3><p>${esc(x.notes)||'<span class="muted">Add your own interpretation.</span>'}</p><section id="visual"><h3>Visualization</h3><div class="row">${btn('Generate',"setVisualMode('Generate')",visualMode==='Generate'?'primary':'secondary')}${btn('Edit',"setVisualMode('Edit')",visualMode==='Edit'?'primary':'secondary')}</div><label for="prompt">${visualMode==='Edit'?'Adjust your description':'Scene description'}</label><textarea id="prompt" style="min-height:90px">${esc(x.prompt||x.summary)}</textarea><label for="style">Style</label><select id="style"><option>Watercolor</option><option>Moonlight</option><option>Sketch</option></select><button class="primary wide" style="margin-top:12px" onclick="generateImage(this)">Generate image</button><div id="result"></div><h3>Kept versions</h3><div id="versions">${versions(x)}</div></section>`}
if(route==='conversation'&&d())html=`<div class="eyebrow">Reflect together</div><div id="messages" aria-live="polite">${messages()}</div><form class="composer" onsubmit="sendMessage(event)">${btn('+',"attachMenu()") }<input id="message" aria-label="Message" placeholder="Ask about this dream…" required><button class="primary" aria-label="Send message">↑</button></form><p class="hint">Responses are scripted for this user test.</p>`;
if(route==='patterns')html=`<input placeholder="Search patterns…" aria-label="Search patterns" oninput="searchPatterns(this.value)"><button id="patterncard" class="card" onclick="go('pattern')"><div class="eyebrow">Recurring theme</div><div class="title">${esc(db.pattern)}</div><p class="muted">${db.dreams.filter(x=>x.tags.includes('Nature')).length} supporting dreams</p>${db.dreams.filter(x=>x.tags.includes('Nature')).map(x=>`<div>· ${esc(x.title)}</div>`).join('')}</button>`;
if(route==='pattern')html=`<div class="row spread"><span class="eyebrow">A thread across dreams</span>${btn('Rename','renamePattern()')}</div><h3>Supporting dreams</h3>${cards(db.dreams.filter(x=>x.tags.includes('Nature')))}<h3>Summary & analysis</h3><p>Natural settings appear in these dreams, alongside different feelings: calm connection in the garden and uncertainty in the forest.</p><blockquote>What changes about your feelings when the setting changes?</blockquote><p class="hint">This is a sample interpretation, not a prediction.</p>`;
if(route==='notes')html=`<div class="eyebrow">Your waking world</div><h2>Small moments matter.</h2>${db.notes.map(n=>`<button class="card" onclick="noteId=${n.id};go('note')"><div class="date">${date(n.date)} · #${n.id}</div><div class="title">${esc(noteLabel(n))}</div><p>${esc(n.text)}</p></button>`).join('')||'<p>No notes yet.</p>'}${btn('+ Add notes',"noteId=0;go('editor')",'primary wide')}`;
if(route==='note'){let n=db.notes.find(x=>x.id===noteId);html=n?`<div class="row spread"><span class="date">${date(n.date)}</span>${btn('✎ Edit',"go('editor')")}</div><p style="white-space:pre-wrap">${esc(n.text)}</p>`:'<p>Note not found.</p>'}
if(route==='editor'){let n=db.notes.find(x=>x.id===noteId);html=`<form onsubmit="saveNote(event)"><label for="notetitle">Title (optional)</label><input id="notetitle" maxlength="100" value="${esc(n?.title||'')}" placeholder="Leave blank to use notes#${n?.id||Math.max(0,...db.notes.map(x=>x.id))+1}"><label for="notedate">Date</label><input id="notedate" type="date" required value="${n?.date||new Date().toISOString().slice(0,10)}"><label for="notetext">Your note</label><textarea id="notetext" required style="min-height:270px">${esc(n?.text||'')}</textarea><div class="actions">${btn('Cancel',`go('${noteId?'note':'notes'}')`)}<button class="primary">Save note</button></div></form>`}
if(route==='settings')html=`<h2>Make space your way.</h2><p class="muted">Choose what is available for reflection.</p><label class="switch">Dream journal<input type="checkbox" ${db.settings.dreams?'checked':''} onchange="db.settings.dreams=this.checked;save()"></label><label class="switch">Life notes<input type="checkbox" ${db.settings.notes?'checked':''} onchange="db.settings.notes=this.checked;save()"></label><h3>About this demo</h3><p class="muted">Your changes stay in this browser. AI text, speech input, and image generation are simulated. No backend or account is connected.</p>${btn('Reset test data','resetData()','secondary danger')}`;
$('#main').innerHTML=html;if(route==='journal')updateList();}
function updateList(){let xs=db.dreams.filter(x=>(x.title+' '+x.text+' '+x.tags.join(' ')).toLowerCase().includes(query.toLowerCase())&&(filter==='All'||x.tags.includes(filter)));$('#list').innerHTML=(processing?'<div class="card" role="status"><div class="title">New dream</div><p class="muted">Generating tags and summary…</p></div>':'')+`<p class="muted">${filter==='All'?'All dreams':esc(filter)} · ${xs.length} entries</p>`+cards(xs)+(xs.length?'':`<p>No dreams match this search.</p>`)}
function themed(t){go('journal');filter=t;updateList()}
function dialog(title,body,onSave){$('#modal').innerHTML=`<h2>${title}</h2>${body}<div class="actions">${btn('Cancel',"document.getElementById('modal').close()")}${btn('Save',onSave,'primary')}</div>`;$('#modal').showModal()}
function searchPatterns(value){document.getElementById("patterncard").hidden=!db.pattern.toLowerCase().includes(value.toLowerCase())}
function filterDialog(){dialog('Filter dreams',`<label for="filterselect">Feeling or theme</label><select id="filterselect">${['All',...new Set(db.dreams.flatMap(x=>x.tags))].map(t=>`<option ${t===filter?'selected':''}>${esc(t)}</option>`).join('')}</select>`,"filter=document.getElementById('filterselect').value;document.getElementById('modal').close();updateList()")}
function bulb(){return '<svg viewBox="0 0 24 24" width="24" height="28" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 15c0-2-3-3-3-7a7 7 0 0 1 14 0c0 4-3 5-3 7v2H8zM9 20h6M10 23h4M12 0v-2M2 3 0 1M22 3l2-2"/></svg>'}
function mic(){return '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>'}
function chatIcon(){return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M21 11a9 9 0 0 1-9 9H5l-4 3 2-7a9 9 0 1 1 18-5z"/><path d="M7 9h10M7 13h7"/></svg>'}
function autoTitle(text){return text.trim().split(/[.!?\n]/)[0].slice(0,48)||''}
function updateDraft(text){draft=text;if(!titleEdited)draftTitle=autoTitle(text);persistDraft();autoSaveCapture();updateCaptureHeader();if($('.autosave-status'))$('.autosave-status').textContent=draft.trim()?'Saved automatically':'Your dream saves automatically as you write.'}
function updateCaptureHeader(){if(route==='capture')$('header h1').innerHTML=`<button type="button" class="title-edit" onclick="editDraftTitle()" aria-label="Edit dream title">${esc(draftTitle||'Journal')} <span aria-hidden="true">✎</span></button>`}
function editDraftTitle(){dialog('Dream title',`<input id="drafttitle" aria-label="Dream title" maxlength="100" value="${esc(draftTitle)}" placeholder="Journal">`,"let value=document.getElementById('drafttitle').value.trim();draftTitle=value;titleEdited=!!value;if(!value)draftTitle=autoTitle(draft);persistDraft();autoSaveCapture();document.getElementById('modal').close();updateCaptureHeader()")}
function toggleRecord(){recording?stopRecord():startRecord()}
function startRecord(){if(recording)return;recordSnapshot={text:draft,title:draftTitle,edited:titleEdited,id:captureId};recording=true;render();recordTimer=setTimeout(()=>{if(!recording)return;updateDraft((draft?draft+' ':'')+'I was in a quiet garden. An old friend waved to me, and we walked among the flowers. I felt happy.');$('#dreamtext').value=draft},700)}
function stopRecord(){if(!recording)return;clearTimeout(recordTimer);recording=false;recordSnapshot=null;render()}
function cancelRecord(){if(!recording)return;clearTimeout(recordTimer);draft=recordSnapshot.text;draftTitle=recordSnapshot.title;titleEdited=recordSnapshot.edited;recording=false;recordSnapshot=null;persistDraft();autoSaveCapture();render()}
function keyboardCapture(){stopRecord();$('#dreamtext').focus()}
function cancelCapture(){if(!draft.trim()){go('journal');return}$('#modal').innerHTML=`<h2>Discard this dream?</h2><p>Your unsaved text will be removed.</p><div class="actions">${btn('Keep writing',"document.getElementById('modal').close()")}${btn('Discard',"draft='';draftTitle='';titleEdited=false;persistDraft();document.getElementById('modal').close();go('journal')",'primary')}</div>`;$('#modal').showModal()}
function trashIcon(){return '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>'}
function autoSaveCapture(){const text=draft.trim();if(!text){if(captureId){db.dreams=db.dreams.filter(x=>x.id!==captureId);captureId=null;save()}persistDraft();return}let entry=db.dreams.find(x=>x.id===captureId);if(!entry){captureId=Date.now();entry={id:captureId,date:new Date().toISOString().slice(0,10),tags:['Reflection'],motif:'❀',analysis:'Which moment or feeling stayed with you most? You can add your interpretation below or explore it in conversation.',notes:'',versions:[],messages:[]};db.dreams.unshift(entry)}entry.text=text;entry.title=draftTitle||autoTitle(text)||'New dream';entry.summary=text.slice(0,110)+(text.length>110?'…':'');save();persistDraft()}
function discardCapture(){$('#modal').innerHTML=`<h2>Delete this dream?</h2><p>This removes the current recording from your journal.</p><div class="actions">${btn('Keep dream',"document.getElementById('modal').close()")}${btn('Delete',"clearTimeout(recordTimer);recording=false;recordSnapshot=null;draft='';draftTitle='';titleEdited=false;autoSaveCapture();document.getElementById('modal').close();go('journal')",'primary')}</div>`;$('#modal').showModal()}
function editSavedTitle(){dialog('Dream title',`<input id="savedtitle" aria-label="Dream title" maxlength="100" value="${esc(d().title)}">`,"let title=document.getElementById('savedtitle').value.trim();if(!title){toast('Add a dream title.');return}d().title=title;save();document.getElementById('modal').close();render()")}
function noteLabel(n){return n?.title?.trim()||'notes#'+(n?.id||noteId)}
function annotate(){dialog('Your interpretation',`<textarea id="annotation">${esc(d().notes)}</textarea>`,"d().notes=document.getElementById('annotation').value;save();document.getElementById('modal').close();render()")}
function editTags(){dialog('Dream tags',`<label for="taginput">Separate tags with commas</label><input id="taginput" value="${esc(d().tags.join(', '))}">`,"d().tags=document.getElementById('taginput').value.split(',').map(x=>x.trim()).filter(Boolean);save();document.getElementById('modal').close();render()")}
function editText(){dialog('Edit dream',`<textarea id="edittext">${esc(d().text)}</textarea>`,"if(document.getElementById('edittext').value.trim()){d().text=document.getElementById('edittext').value.trim();save();document.getElementById('modal').close();render()}else toast('Dream text cannot be empty.')")}
function deleteDream(){$('#modal').innerHTML=`<h2>Delete this dream?</h2><p>This removes the dream and its saved images from this demo.</p><div class="actions">${btn('Cancel',"document.getElementById('modal').close()")}${btn('Delete',"db.dreams=db.dreams.filter(x=>x.id!==selected);save();document.getElementById('modal').close();go('journal')",'primary')}</div>`;$('#modal').showModal()}
function messages(){return `<div class="chat">What would you like to explore about this dream?</div>`+d().messages.map(m=>`<div class="chat ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}
function sendMessage(e){e.preventDefault();let s=$('#message').value.trim();if(!s)return;d().messages.push({role:'user',text:s});let reply=db.settings.dreams?'You mentioned “'+s.slice(0,65)+'”. Thinking about “'+d().title+'”, which feeling seems closest to what you have been experiencing lately?':'Dream journal context is off in Settings. What feeling would you like to reflect on?';d().messages.push({role:'assistant',text:reply});save();$('#messages').innerHTML=messages();$('#message').value='';$('#main').scrollTop=$('#main').scrollHeight}
function attachMenu(){dialog('Add context',`<p>Select a life note to include in your next message.</p><select id="context">${db.notes.map(n=>`<option value="${n.id}">${esc(n.text.slice(0,65))}</option>`).join('')}</select>`,"if(!db.settings.notes){toast('Enable Life notes context in Settings.')}else{let n=db.notes.find(x=>x.id===Number(document.getElementById('context').value));if(n)document.getElementById('message').value='Life note: '+n.text;document.getElementById('modal').close()}")}
function setVisualMode(m){if($('#prompt')){d().prompt=$('#prompt').value;save()}visualMode=m;render();$('#visual').scrollIntoView({block:'start'})}
let imageStyle='Watercolor';function generateImage(b){let x=d();x.prompt=$('#prompt').value;imageStyle=$('#style').value;if(!x.prompt.trim()){toast('Describe the scene first.');return}save();b.disabled=true;b.textContent='Creating sample image…';setTimeout(()=>{if(route!=='detail'||d()!==x)return;b.disabled=false;b.textContent='Generate image';generated=true;$('#result').innerHTML='<h3>Result</h3>'+land(imageStyle)+'<p class="hint">Sample landscape · '+esc(imageStyle)+'</p>'+btn('Save to list','keepImage()','secondary wide')},800)}
function versions(x){return x.versions.length?x.versions.map(v=>`<div class="card">${land(v.style)}<p>${esc(v.prompt)}</p><span class="date">${esc(v.style)}</span></div>`).join(''):'<p class="muted">Your saved images will appear here.</p>'}
function keepImage(){if(!generated)return;d().versions.unshift({style:imageStyle,prompt:d().prompt});save();$('#versions').innerHTML=versions(d());generated=false;toast('Added to kept versions.')}
function renamePattern(){dialog('Rename pattern',`<input id="patternname" aria-label="Pattern name" value="${esc(db.pattern)}">`,"if(document.getElementById('patternname').value.trim()){db.pattern=document.getElementById('patternname').value.trim();save();document.getElementById('modal').close();render()}")}
function saveNote(e){e.preventDefault();let text=$('#notetext').value.trim(),title=$('#notetitle').value.trim();if(!text){toast('Write a note before saving.');return}let n=db.notes.find(x=>x.id===noteId);if(n){n.title=title;n.text=text;n.date=$('#notedate').value}else{noteId=Math.max(0,...db.notes.map(x=>x.id))+1;db.notes.unshift({id:noteId,title,text,date:$('#notedate').value})}save();go('note');toast('Note saved.')}
function resetData(){$('#modal').innerHTML=`<h2>Start a fresh test?</h2><p>All changes in this browser will be replaced with the sample data.</p><div class="actions">${btn('Cancel',"document.getElementById('modal').close()")}${btn('Reset',"db=structuredClone(seed);draft='';draftTitle='';titleEdited=false;captureId=null;persistDraft();save();document.getElementById('modal').close();go('home')",'primary')}</div>`;$('#modal').showModal()}
window.addEventListener('hashchange',()=>{let r=location.hash.slice(1);if(['home','journal','capture','detail','conversation','patterns','pattern','notes','note','editor','settings'].includes(r)&&r!==route){route=r;render()}});render();
</script></body></html>
